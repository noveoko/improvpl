repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          - django>=5.1,<6.0
          - django-stubs>=5.1,<7
          - django-environ
          - types-Pillow
        args: [--config-file=pyproject.toml, core, improvpl, manage.py]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, core, improvpl, -ll]
        pass_filenames: false