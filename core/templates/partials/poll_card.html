{% load i18n %}
<article class="card p-5">
    <div class="flex items-start justify-between gap-2 mb-2">
        <h3 class="text-2xl font-black">{{ poll.city }}</h3>
        <span class="text-xs font-bold px-3 py-1 rounded-full {% if poll.event_type == 'workshop' %}badge-workshop{% else %}badge-jam{% endif %}">
            {{ poll.get_event_type_display }}
        </span>
    </div>

    <p class="text-sm mb-4 line-clamp-2">{{ poll.description|truncatewords:30 }}</p>

    <div class="mb-2 flex justify-between text-sm font-semibold">
        <span>{{ poll.vote_count }}/{{ poll.threshold }} {% trans "votes" %}</span>
        <span>{{ poll.days_remaining }} {% trans "days left" %}</span>
    </div>
    <div class="progress-bar mb-4">
        <div class="progress-fill" style="width: {{ poll.progress_percent }}%"></div>
    </div>

    <button type="button"
            data-modal-open="vote-modal-{{ poll.pk }}"
            class="w-full btn-primary text-center">
        {% trans "Vote for this!" %}
    </button>
</article>
