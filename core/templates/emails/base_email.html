<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: system-ui, sans-serif; color: #111111; margin: 0; padding: 0; }
        .wrapper { max-width: 560px; margin: 0 auto; }
        .header { background: #FFEB3B; padding: 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .body { background: #ffffff; padding: 32px 24px; }
        .footer { background: #f3f4f6; padding: 16px 24px; text-align: center; font-size: 12px; color: #6b7280; }
        .btn { display: inline-block; background: #111111; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>🎭 Improv.pl</h1>
        </div>
        <div class="body">
            {% block email_content %}{% endblock %}
        </div>
        <div class="footer">
            <p>English improv workshops & jams across Poland</p>
            <p>hello@improv.pl</p>
        </div>
    </div>
</body>
</html>
